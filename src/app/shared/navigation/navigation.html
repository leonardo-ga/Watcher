<header class="navigation" [class.is-hidden]="isHeaderHidden()">
  <a class="brand" routerLink="/" (click)="scrollToTop()" aria-label="Watcher home">
    <span class="brand-mark" aria-hidden="true"><i></i></span>
    <span class="brand-name">watcher<span>.</span></span>
  </a>

  <nav #navigationLinks aria-label="Main navigation">
    <span class="nav-pill" aria-hidden="true"></span>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      (isActiveChange)="updateActivePill()" (click)="scrollToTop()">Home</a>
    <a routerLink="/watches" routerLinkActive="active" (isActiveChange)="updateActivePill()"
      (click)="scrollToTop()">Discover</a>
    <a routerLink="/journal" routerLinkActive="active" (isActiveChange)="updateActivePill()"
      (click)="scrollToTop()">Journal</a>
  </nav>

  <span class="edition">EST. 2026</span>
</header>
